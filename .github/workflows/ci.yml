name: CI

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Kempt Check
        uses: ZacSweers/kempt@v0.3.1
        with:
          cache: true

      - name: Run Lint
        run: ./gradlew lint

  build-non-apple:
    name: Build & Test (Non-Apple)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Checks & Tests
        run: ./gradlew check -x lint

      - name: Build Everything (Non-Apple)
        run: ./gradlew assemble

  build-apple:
    name: Build & Test (Apple)
    runs-on: macos-latest
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx6g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1" -Dkotlin.native.jvmArgs="-Xmx6g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/cache
            ~/.konan/dependencies
            ~/.konan/kotlin-native-macos*
            ~/.konan/kotlin-native-prebuilt-macos*
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Run Apple Checks & Tests
        run: ./gradlew :retainx:macosArm64Test :retainx:iosSimulatorArm64Test

      - name: Build Apple Targets & Frameworks
        run: |
          ./gradlew \
            :retainx:compileKotlinIosArm64 \
            :retainx:compileKotlinIosSimulatorArm64 \
            :retainx:compileKotlinWatchosArm32 \
            :retainx:compileKotlinWatchosArm64 \
            :retainx:compileKotlinWatchosSimulatorArm64 \
            :retainx:compileKotlinTvosArm64 \
            :retainx:compileKotlinTvosSimulatorArm64 \
            :retainx:compileKotlinMacosArm64 \
            :sample:shared:assemble

  publish-snapshot:
    name: Publish Snapshot
    runs-on: ubuntu-latest
    needs: [lint, build-non-apple, build-apple]
    if: github.repository == 'stagg/retainx' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 23
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '23'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Konan
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan/cache
            ~/.konan/dependencies
            ~/.konan/kotlin-native-linux*
            ~/.konan/kotlin-native-prebuilt-linux*
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-konan-

      - name: Publish Snapshot
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: ./gradlew publish


