# Gradle
org.gradle.jvmargs=-Xmx4096M -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.tooling.parallel=true

# AndroidX flags
android.useAndroidX=true
android.newDsl=true
android.builtInKotlin=true
android.disallowKotlinSourceSets=true

# Kotlin flags
kotlin.daemon.jvmargs=-Xmx4096M -XX:+UseG1GC
kotlin.native.jvmArgs=-Xmx4g -XX:+UseG1GC -XX:SoftRefLRUPolicyMSPerMB=1
kotlin.mpp.enableCInteropCommonizer=true
kotlin.native.enableKlibsCrossCompilation=true
kotlin.native.ignoreDisabledTargets=true

# Compose Multiplatform experimental target flags
org.jetbrains.compose.experimental.jscanvas.enabled=true
org.jetbrains.compose.experimental.macos.enabled=true
org.jetbrains.compose.experimental.wasm.enabled=true

# Version
GROUP=me.stagg.retainx
VERSION_NAME=0.1.0-SNAPSHOT
