POM_SCM_CONNECTION=scm:git:git://github.com/stagg/retainx.git
POM_SCM_DEV_CONNECTION=scm:git:ssh://git@github.com/stagg/retainx.git
POM_LICENCE_NAME=MIT License
POM_LICENCE_URL=https://github.com/stagg/retainx/blob/main/LICENSE
POM_LICENCE_DIST=repo
POM_DEVELOPER_ID=stagg
POM_DEVELOPER_NAME=Josh Stagg
POM_DEVELOPER_URL=https://github.com/stagg
