name: SampleIOS
options:
  bundleIdPrefix: com.retainx.sample
targets:
  SampleIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [App]
    settings:
      base:
        FRAMEWORK_SEARCH_PATHS: 
          - "$(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
        OTHER_LDFLAGS:
          - "-framework"
          - "SampleShared"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    preBuildScripts:
      - name: Build KMP Framework
        script: |
          cd "$SRCROOT/../.."
          ./gradlew :sample:shared:embedAndSignAppleFrameworkForXcode
